services:
  authservice:
    build:
      context: .
      dockerfile: src/Services/AuthService/Dockerfile
    container_name: bitask-authservice
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - bitask-net

  productservice:
    build:
      context: .
      dockerfile: src/Services/ProductService/Dockerfile
    container_name: bitask-productservice
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - bitask-net

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    container_name: bitask-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address=http://authservice:8080/
      - ReverseProxy__Clusters__product-cluster__Destinations__destination1__Address=http://productservice:8080/
    depends_on:
      - authservice
      - productservice
    networks:
      - bitask-net

networks:
  bitask-net:
    driver: bridge
