<div class="toast-stack">
  @for (toast of notifications.notifications(); track toast.id) {
    <div class="toast" [class.toast-error]="toast.type === 'error'" [class.toast-success]="toast.type === 'success'">
      <span>{{ toast.message }}</span>
      <button type="button" (click)="notifications.dismiss(toast.id)" aria-label="Dismiss">&times;</button>
    </div>
  }
</div>
